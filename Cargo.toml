[package]
name = "clippo"
version = "0.1.0"
edition = "2024"
description = "Clipboard history for Wayland, with OCR for images"
license = "MIT"
repository = "https://github.com/pengowray/clippo"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
evdev = "0.13"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff"] }
libc = "0.2.189"
ocrs = "=0.13.1"
rten = "=0.26.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
toml = "1.1.6"

# Dependencies (ocrs/rten especially) are unusably slow unoptimised.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
